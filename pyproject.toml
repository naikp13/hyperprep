[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperprep"
version = "0.1.0"
description = "One-stop pre-processing for terrestrial, drone and satellite hyperspectral imagery"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "naikp13"}]
keywords = ["hyperspectral", "remote sensing", "pre-processing", "reflectance", "hylite", "EnMAP", "EMIT", "PRISMA", "UAV"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.21", "scipy>=1.7", "pyyaml>=5.4"]

[project.optional-dependencies]
terrestrial = ["hylite>=1.3"]
geo = ["rasterio>=1.3"]
satellite = ["rasterio>=1.3", "h5py>=3.6"]
plot = ["matplotlib>=3.5"]
all = ["hylite>=1.3", "rasterio>=1.3", "h5py>=3.6", "matplotlib>=3.5"]
dev = ["pytest>=7", "h5py>=3.6", "rasterio>=1.3"]

[project.scripts]
hyperprep = "hyperprep.cli:main"

[project.urls]
Homepage = "https://github.com/naikp13/hyperprep"

[tool.setuptools.packages.find]
include = ["hyperprep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
